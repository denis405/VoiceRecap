<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6A4DFF"/>
      <stop offset="0.55" stop-color="#4F6BFF"/>
      <stop offset="1" stop-color="#22C1D6"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.2" cy="0.2" r="0.8">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="640" height="360" fill="url(#bg)"/>
  <rect width="640" height="360" fill="url(#glow)"/>

  <!-- voice bubble -->
  <g transform="translate(48 92)">
    <rect width="236" height="76" rx="38" fill="#FFFFFF" fill-opacity="0.18"/>
    <circle cx="38" cy="38" r="24" fill="#FFFFFF"/>
    <path d="M32 26 L50 38 L32 50 Z" fill="#5A5CFF"/>
    <g fill="#FFFFFF">
      <rect x="76"  y="32" width="8" height="12" rx="4"/>
      <rect x="90"  y="22" width="8" height="32" rx="4"/>
      <rect x="104" y="14" width="8" height="48" rx="4"/>
      <rect x="118" y="24" width="8" height="28" rx="4"/>
      <rect x="132" y="30" width="8" height="16" rx="4"/>
      <rect x="146" y="20" width="8" height="36" rx="4"/>
      <rect x="160" y="28" width="8" height="20" rx="4"/>
      <rect x="174" y="33" width="8" height="10" rx="4"/>
    </g>
    <text x="196" y="44" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#FFFFFF" fill-opacity="0.85">3:42</text>
  </g>

  <!-- arrow -->
  <path d="M150 190 L150 214 M140 205 L150 216 L160 205" fill="none" stroke="#FFFFFF" stroke-opacity="0.8"
        stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- recap card -->
  <g transform="translate(48 232)">
    <rect width="236" height="92" rx="18" fill="#FFFFFF"/>
    <g stroke-linecap="round" stroke-width="9">
      <line x1="22" y1="26" x2="150" y2="26" stroke="#5A5CFF"/>
      <line x1="22" y1="48" x2="200" y2="48" stroke="#C9CCF5"/>
      <line x1="22" y1="68" x2="170" y2="68" stroke="#C9CCF5"/>
    </g>
  </g>

  <!-- title -->
  <g font-family="Inter, DejaVu Sans, sans-serif" fill="#FFFFFF">
    <text x="330" y="150" font-size="44" font-weight="800">VoiceRecap</text>
    <text x="332" y="192" font-size="19" fill-opacity="0.92">Голосовые и кружочки —</text>
    <text x="332" y="218" font-size="19" fill-opacity="0.92">в короткий пересказ</text>
    <text x="352" y="262" font-size="15" fill-opacity="0.75">суть · ключевые мысли · задачи</text>
  </g>
  <path d="M340 248 Q341.5 255.5 348 257 Q341.5 258.5 340 266 Q338.5 258.5 332 257 Q338.5 255.5 340 248 Z"
        fill="#FFFFFF" fill-opacity="0.85"/>
</svg>
